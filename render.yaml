services:
  - type: web
    name: avs-12-hub
    runtime: node
    plan: free
    repo: https://github.com/devanand2008/avs-12th-student-hub
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:web
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_DEMO_DATA
        value: "false"
      - key: NEXT_PUBLIC_ENABLE_DEMO_LOGIN
        value: "false"
      - key: STUDENT_ACTIVATION_MODE
        sync: false
      - key: TEXTBOOK_DELIVERY
        value: official
      - key: AI_PROVIDER
        value: excerpts
      - key: APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PORT
        value: 10000
